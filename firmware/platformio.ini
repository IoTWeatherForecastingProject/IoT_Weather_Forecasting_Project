; PlatformIO Project Configuration File for Weather Station
; Support both ESP32 and ESP8266 boards

[platformio]
default_envs = esp8266

[common]
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/DHT sensor library @ ^1.4.6
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.4
    adafruit/Adafruit SH110X @ ^2.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:esp32dev]
build_src_filter = +<main.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = 
    -D ESP32_BOARD=1

[env:esp8266]
build_src_filter = +<main.cpp>
platform = espressif8266 @ 4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = 
    -D ESP8266_BOARD=1

[env:esp8266_dht11]
extends = env:esp8266
build_src_filter = +<dht11_check.cpp>
lib_deps = adafruit/DHT sensor library @ ^1.4.6

[env:esp8266_relay]
extends = env:esp8266
build_src_filter = +<relay_check.cpp>
lib_deps = adafruit/DHT sensor library @ ^1.4.6

[env:esp8266_oled]
extends = env:esp8266
build_src_filter = +<oled_check.cpp>
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:esp8266_buzzer_single]
extends = env:esp8266_relay
build_flags =
    ${env:esp8266.build_flags}
    -D RELAY_CHECK_SINGLE_PULSE=1

[env:esp8266_rain_do]
extends = env:esp8266_oled
build_src_filter = +<rain_do_check.cpp>

[env:esp8266_buzzer_d0]
extends = env:esp8266_buzzer_single
build_flags =
    ${env:esp8266_buzzer_single.build_flags}
    -D RELAY_CHECK_GPIO=16

; Historical checkpoint MOC_01 used D6 for the relay; current wiring uses D0.
[env:esp8266_rain_do_legacy_d6]
extends = env:esp8266_rain_do
build_flags =
    ${env:esp8266.build_flags}
    -D ESP8266_RELAY_GPIO=12

[env:esp8266_pressure]
extends = env:esp8266
build_src_filter = +<pressure_check.cpp>
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit SH110X @ ^2.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9

; Partial hardware commissioning; isolated from weather/+/data and real alerts.
[env:esp8266_commissioning]
extends = env:esp8266
build_src_filter = +<commissioning.cpp>
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.4
    adafruit/Adafruit SH110X @ ^2.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:esp8266_commissioning_relay]
extends = env:esp8266_commissioning
build_flags =
    ${env:esp8266_commissioning.build_flags}
    -D COMMISSIONING_RAIN_RELAY=1

[env:esp8266_station_do]
extends = env:esp8266_commissioning_relay
build_flags =
    ${env:esp8266_commissioning_relay.build_flags}
    -D COMMISSIONING_PUBLISH_WEATHER=1

